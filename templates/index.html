<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Theload Gym</title>
    <!-- Vinculação do arquivo CSS único -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <header>
            <h1>The<span>load</span></h1>
            <p>Selecione a rotina de hoje</p>
            <a href="/desempenho" class="link-destaque">Histórico de treinos &rarr;</a>
        </header>

        <main class="grid-rotinas">
            <!-- Estrutura de repetição das rotinas geradas pelo back-end -->
            {% for rotina in rotinas %}
            <div class="card-rotina fade-in">
                
                <div class="card-header flex-between-start">
                    <div>
                        <h2>{{ rotina.nome }}</h2>
                        <span class="foco">{{ rotina.foco }}</span>
                    </div>
                    <a href="/editar/{{ rotina.id }}" class="btn-editar" title="Editar Rotina">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#888888" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                            <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
                        </svg>
                    </a>
                </div>

                <ul class="preview-exercicios">
                    {% for exercicio in rotina.exercicios %}
                        <li>{{ exercicio.nome }} ({{ exercicio.series | length }} séries)</li>
                    {% endfor %}
                </ul>
                
                <a href="/treino/{{ rotina.id }}" class="btn-iniciar">Iniciar Treino</a>
            </div>
            {% endfor %}
        </main>
    </div>

    <!-- Vinculação do arquivo JavaScript único -->
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
